<!doctype html>
<!-- The installer's page header image, at twice NSIS's 150x57. NSIS puts it
     at the right of a white header strip, so the background is white. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 300px; height: 114px; overflow: hidden; background: #fff; }
  /* From the left: headless Edge's window is wider than the image, so
     "right" would land outside what's captured. */
  svg { position: absolute; left: 200px; top: 17px; width: 80px; height: 80px; }
</style>
</head>
<body>
  <svg viewBox="0 0 1932 1932" aria-hidden="true">
    <rect width="1932" height="1932" rx="520" fill="#1a1b23"/>
    <g transform="translate(-1 98.6) scale(1.00104)" fill="none" stroke="#fff" stroke-width="170" stroke-linecap="round" stroke-linejoin="round">
      <path d="M279 882C279 560 330 433 450 433C560 433 680 545 760 638Q966 564 1172 638C1252 545 1372 433 1482 433C1602 433 1653 560 1653 882"/>
      <path d="M650 990V1250M966 1210V1300M1282 990V1250"/>
    </g>
  </svg>
</body>
</html>
