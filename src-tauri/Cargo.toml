[package]
name = "attune"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "attune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
attune-core = { path = "../core" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2"

# Release profile lives in the workspace root Cargo.toml (member profiles are ignored).

[target.'cfg(windows)'.dependencies]
# Reads whether the taskbar is light or dark, for the tray icon's colour.
windows-registry = "0.6"
# Sets the window's big (taskbar) icon, which Tauri's set_icon leaves out.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
