[package]
name = "jam-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MyJam session relay: an in-memory WebSocket server around jam-protocol's coordinator."

[lib]
name = "jam_server"
path = "src/lib.rs"

[[bin]]
name = "jam-server"
path = "src/main.rs"

[dependencies]
jam-protocol = { path = "../protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# Tests drive the server with the real desktop client.
jam-core = { path = "../core" }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
