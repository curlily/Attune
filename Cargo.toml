[workspace]
members = ["protocol", "core", "server", "src-tauri"]
resolver = "2"

[workspace.dependencies]
chromiumoxide = "0.9.1"
futures-util = "0.3.33"
reqwest = { version= "0.13.4", features = ["json"] }
# TLS for wss://: rustls with the aws-lc-rs provider reqwest already uses, and the
# OS certificate store for trust roots.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.36.1"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Same tungstenite major as chromiumoxide's async-tungstenite, so it is not duplicated.
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
uuid = { version = "1.27.0", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.21"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true